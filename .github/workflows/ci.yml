name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate Python (syntax + ruff + mypy + bandit + pip-audit)
        run: uv run python scripts/validate-python.py

      - name: Unit tests (90% branch-coverage gate)
        run: uv run pytest

      - name: Functional tests (local GraphQL server)
        run: uv run pytest tests/functional -m functional --no-cov

  ci-success:
    name: CI success
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the check matrix passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "::error::check matrix did not succeed (result: ${{ needs.check.result }})"
            exit 1
          fi
          echo "All checks passed."
