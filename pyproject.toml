[project]
name = "cyql"
dynamic = ["version"]
description = "Python client and CLI for the Cyql cycling-club API (GORBA)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Mark Buckaway" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.scripts]
cyql = "cyql.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "ariadne>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cyql/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cyql"]

[tool.ruff]
target-version = "py314"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/cyql"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --cov=cyql --cov-branch --cov-report=term-missing --cov-fail-under=90"
markers = [
    "functional: tests that require the local mock GraphQL server (run separately, with --no-cov)",
]

[tool.coverage.run]
branch = true
source = ["cyql"]

[tool.coverage.report]
show_missing = true
